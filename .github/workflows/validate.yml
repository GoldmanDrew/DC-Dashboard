name: Validate public boundary

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enforce public-only repository
        run: python scripts/validate_public_boundary.py
      - name: Install build tooling
        run: npm install --no-audit --no-fund

      # assets/app.bundle.js is committed so the repository stays deployable as
      # plain static files. That only works if it cannot drift from its source,
      # so rebuild and compare rather than trusting the committed artifact.
      - name: Verify app bundle matches assets/app.jsx
        run: node build.mjs --check

      - name: Check browser assets
        run: |
          for file in assets/*.js assets/vendor/*.js; do
            node --check "$file"
          done
      - name: Run dashboard unit tests
        run: |
          for test_file in tests/*.js; do
            node "$test_file"
          done
